<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AnimDraw</title>
<link rel="stylesheet" href="css/style.css">
</head><body>

<!-- Главное меню -->
<div id="start-screen" style="display:flex; flex-direction:column; height:100%; background:var(--bg); padding:20px; gap:15px; justify-content:center;">
  <h2 style="text-align:center; margin-bottom:20px;">AnimDraw</h2>
  <button class="menu-btn" onclick="openNewCanvas()">Новый холст</button>
  <button class="menu-btn" onclick="openLastProject()">Прошлый холст</button>
  <button class="menu-btn" onclick="openGallery()">Моя галерея</button>
</div>

<!-- Экран создания холста -->
<div id="new-canvas-screen" style="display:none; flex-direction:column; height:100%; background:var(--bg); padding:20px; gap:10px; overflow-y:auto;">
  <h3>Новый холст</h3>
  <label>Ширина <input type="number" id="nc-w" value="2100" style="width:80px"> px</label>
  <label>Высота <input type="number" id="nc-h" value="2800" style="width:80px"> px</label>
  <label>DPI <input type="number" id="nc-dpi" value="350" style="width:80px"></label>
  <label>Цвет фона <input type="color" id="nc-bg" value="#ffffff"></label>
  <div class="row" style="margin-top:10px;">
    <button onclick="createNewCanvas()">Создать</button>
    <button onclick="showStart()">Отмена</button>
  </div>
</div>

<!-- Экран галереи -->
<div id="gallery-screen" style="display:none; flex-direction:column; height:100%; background:var(--bg); overflow-y:auto;">
  <div class="row" style="padding:10px; justify-content:space-between; align-items:center;">
    <h3 style="margin:0;">Моя галерея</h3>
    <button onclick="showStart()">Назад</button>
  </div>
  <div id="gal-list" style="display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:10px;"></div>
</div>

<!-- Основной интерфейс рисования (скрыт по умолчанию) -->
<div id="app-ui" style="display:none; flex-direction:column; height:100%;">
  <div class="row" id="tools"></div>
  <div class="row" id="opt"></div>
  <div id="cw"><canvas id="cv"></canvas><div id="sb"></div><span id="st" style="position:absolute;left:66px;top:4px;opacity:.7;font-size:11px"></span></div>
  <div class="row" id="tc"></div>
  <div id="fr"></div>
  <div class="row" id="act"></div>
  <div class="row" id="menu"></div>
  <div id="lp"></div><div id="jp"></div><div id="pl"><input id="nm" value="Проект 1" style="width:100%;margin-bottom:8px"><div id="pc"></div></div>
  <input type="file" id="fi" accept=".json,application/json" hidden>
</div>

<script src="js/app.js"></script>
</body></html>
